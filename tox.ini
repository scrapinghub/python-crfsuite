[tox]
envlist = py310,py311,py312,py313,py314,py314t,py315,py315t

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.14t: py314t
    3.15: py315
    3.15t: py315t

[testenv]
changedir = {envtmpdir}
deps =
    pytest
commands =
    py.test {toxinidir}/tests --doctest-modules {posargs}

[testenv:manylinux]
changedir = {envtmpdir}
deps = 
    pytest
commands =
    py.test {toxinidir}/tests --doctest-modules {posargs}
